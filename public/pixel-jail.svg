<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!-- Pixel jail � chocolate bars on cream walls -->
  <rect x="3" y="4" width="18" height="2" fill="#2d170c"/>
  <rect x="4" y="2" width="16" height="2" fill="#5c3418"/>
  <rect x="6" y="1" width="12" height="1" fill="#2d170c"/>

  <rect x="3" y="6" width="18" height="14" fill="#fff4c4"/>
  <rect x="3" y="6" width="18" height="1" fill="#ffe8a8"/>
  <rect x="3" y="19" width="18" height="2" fill="#2d170c"/>
  <rect x="2" y="20" width="20" height="2" fill="#5c3418"/>

  <!-- vertical bars -->
  <rect x="6" y="7" width="2" height="12" fill="#2d170c"/>
  <rect x="11" y="7" width="2" height="12" fill="#2d170c"/>
  <rect x="16" y="7" width="2" height="12" fill="#2d170c"/>

  <!-- door frame -->
  <rect x="9" y="12" width="6" height="7" fill="#c45a00"/>
  <rect x="10" y="13" width="4" height="6" fill="#2d170c"/>
  <rect x="12" y="15" width="1" height="1" fill="#ffd23a"/>

  <!-- JAIL sign -->
  <rect x="7" y="7" width="10" height="3" fill="#ffd23a"/>
  <rect x="8" y="8" width="1" height="1" fill="#2d170c"/>
  <rect x="10" y="8" width="1" height="1" fill="#2d170c"/>
  <rect x="12" y="8" width="1" height="1" fill="#2d170c"/>
  <rect x="14" y="8" width="1" height="1" fill="#2d170c"/>

  <!-- side stones -->
  <rect x="3" y="6" width="1" height="13" fill="#5c3418"/>
  <rect x="20" y="6" width="1" height="13" fill="#5c3418"/>
</svg>
