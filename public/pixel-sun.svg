<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" shape-rendering="crispEdges">
  <!-- Asymmetric rays so clock-spin is obvious -->
  <!-- long top ray (clock hand) -->
  <rect x="9" y="0" width="2" height="4" fill="#fff4c4"/>
  <rect x="9" y="0" width="2" height="1" fill="#ffe566"/>

  <!-- short bottom ray -->
  <rect x="9" y="17" width="2" height="2" fill="#ffb347"/>

  <!-- left ray -->
  <rect x="1" y="9" width="3" height="2" fill="#ffb347"/>

  <!-- long right ray -->
  <rect x="16" y="9" width="4" height="2" fill="#fff4c4"/>
  <rect x="18" y="9" width="2" height="2" fill="#ffe566"/>

  <!-- diagonal ticks -->
  <rect x="3" y="3" width="2" height="2" fill="#ffb347"/>
  <rect x="15" y="3" width="2" height="2" fill="#fff4c4"/>
  <rect x="3" y="15" width="2" height="2" fill="#ffb347"/>
  <rect x="15" y="15" width="2" height="2" fill="#ffb347"/>

  <!-- core -->
  <rect x="6" y="6" width="8" height="8" fill="#ffe566"/>
  <rect x="5" y="7" width="1" height="6" fill="#ffb347"/>
  <rect x="14" y="7" width="1" height="6" fill="#ffb347"/>
  <rect x="7" y="5" width="6" height="1" fill="#ffb347"/>
  <rect x="7" y="14" width="6" height="1" fill="#ffb347"/>

  <!-- face highlight so orientation reads -->
  <rect x="8" y="8" width="2" height="2" fill="#fff4c4"/>
  <rect x="12" y="8" width="1" height="1" fill="#2d170c"/>
  <rect x="8" y="11" width="4" height="1" fill="#c45a00"/>
</svg>
